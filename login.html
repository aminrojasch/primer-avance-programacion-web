<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | QuestPass CR</title>
    <meta name="description" content="Formulario de inicio de sesión para la plataforma QuestPass CR.">
    <link rel="stylesheet" href="assets/css/base.css">
</head>
<body>

    <!-- Encabezado e identidad del sitio -->
    <header>
        <a href="index.html">
            <strong>QuestPass CR</strong>
        </a>
        <nav aria-label="Navegación principal">
            <a href="index.html">Inicio</a>
            <a href="experiencias.html">Experiencias</a>
            <a href="reservar.html">Reservar</a>
            <a href="contacto.html">Contacto</a>
            <a href="login.html">Iniciar sesión</a>
        </nav>
    </header>

    <!-- Contenido principal -->
    <main>
        <h1>Iniciar sesión</h1>

        <section class="login-container">
            <p>Ingresa tus credenciales para acceder a la plataforma.</p>

            <form action="#" method="POST">
                <fieldset>
                    <legend>Credenciales de acceso</legend>

                    <p>
                        <label for="correo">Correo electrónico:</label><br>
                        <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
                    </p>

                    <p>
                        <label for="contrasena">Contraseña:</label><br>
                        <input type="password" id="contrasena" name="contrasena" required>
                    </p>
                </fieldset>

                <p>
                    <button type="submit" class="boton">Ingresar</button>
                </p>
            </form>
        </section>
    </main>

    <!-- Pie de página -->
    <footer>
        <p>QuestPass CR · Proyecto académico SOFT-06</p>
    </footer>

</body>
</html>
